<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WLTH — Log in</title>
  <meta name="description" content="Log in to your WLTH account. Demo for the WLTH platform." />
  <link rel="icon" href="data:," />

  <script src="wlth-sso.js?v=2"></script>

  <style>
    :root {
      --bg: #f4f4f4;
      --surface: #ffffff;
      --text: #292e3a;
      --text-dimmed: #6f7682;
      --text-muted: #8a909c;
      --blue-500: #1445c7;
      --blue-600: #1039a8;
      --blue-soft: #eef1ff;
      --border: #eceff0;
      --field-border: #d7dadf;
      --danger: #d64545;
      --shadow-panel: 0 10px 15px -3px rgba(0,0,0,.1), 0 4px 6px -4px rgba(0,0,0,.1);
      --font: "Inter", SuisseIntl, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; -webkit-font-smoothing: antialiased; }
    a { color: var(--blue-500); text-decoration: none; }
    a:hover { text-decoration: underline; }
    button { font-family: inherit; cursor: pointer; border: none; background: none; }

    .demo-bar { background: var(--blue-soft); color: var(--blue-500); font-size: 13px; font-weight: 500; text-align: center; padding: 8px 16px; border-bottom: 1px solid var(--border); }
    header { height: 84px; display: flex; align-items: center; }
    .header-inner { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center; gap: 10px; }
    .logo { height: 19px; width: auto; color: var(--text); }
    .demo-tag { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--blue-500); background: var(--blue-soft); border: 1px solid #dbe2fb; padding: 3px 8px; border-radius: 9999px; }
    .spacer { flex: 1; }
    .dev-link { font-size: 13px; font-weight: 500; color: var(--text-dimmed); }
    .dev-link:hover { color: var(--text); text-decoration: none; }

    main { display: flex; justify-content: center; padding: 48px 24px 72px; }
    .panel { width: 100%; max-width: 420px; background: var(--surface); border-radius: 24px; box-shadow: var(--shadow-panel); padding: 40px; }
    @media (max-width: 560px) { .panel { padding: 28px; } }
    .panel-head { margin-bottom: 24px; text-align: center; }
    .panel-head h1 { font-size: 24px; font-weight: 600; letter-spacing: -.02em; }
    .panel-head p { margin-top: 6px; color: var(--text-dimmed); font-size: 14px; line-height: 1.5; }

    form { display: flex; flex-direction: column; gap: 16px; }
    .field > .label { display: block; margin-bottom: 6px; font-size: 14px; font-weight: 600; }
    .field input { width: 100%; font-family: inherit; font-size: 14px; color: var(--text); background: var(--surface); border: 1px solid var(--field-border); border-radius: 12px; padding: 10px 14px; transition: border-color .12s ease; }
    .field input::placeholder { color: var(--text-muted); }
    .field input:focus { outline: none; border-color: var(--blue-500); }
    .field .err { margin-top: 5px; font-size: 12px; color: var(--danger); display: none; }
    .field.invalid .err { display: block; }
    .field.invalid input { border-color: var(--danger); }
    .form-error { font-size: 13px; color: var(--danger); min-height: 18px; }

    .btn-primary { display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; background: var(--blue-500); color: #fff; font-size: 16px; font-weight: 500; padding: 13px 24px; border-radius: 12px; margin-top: 4px; transition: background .15s ease, transform .1s ease; }
    .btn-primary:hover { background: var(--blue-600); }
    .btn-primary:active { transform: translateY(1px); }
    .btn-primary:disabled { opacity: .6; cursor: default; }
    .btn-primary svg { width: 18px; height: 18px; }
    .alt { margin-top: 18px; text-align: center; font-size: 14px; color: var(--text-dimmed); }
  </style>
</head>
<body>
  <div class="demo-bar"><b>WLTH — Demo.</b> Log in with the email &amp; password you used to sign up.</div>

  <header>
    <div class="header-inner">
      <a href="/" aria-label="WLTH home"><svg class="logo" viewBox="0 0 80 19" fill="none" aria-label="WLTH"><path d="M6.7765 15.7156L11.4968 0.00566123H15.0306L19.6717 15.6895L23.8111 0.00566123H26.6327L21.3315 18.5507H18.0356L13.2632 2.39017L8.41146 18.5507H5.06227L0 0.00566123H2.82155L6.7765 15.7156ZM33.5439 0V16.1583H44.3592V18.5507H30.942V0H33.5439ZM59.5052 2.39244H52.646V18.5507H50.0453V2.39244H43.1103V0H59.5052V2.39244ZM65.856 8.07857H77.3992V0H80V18.5507H77.3992V10.4722H65.856V18.5507H63.254V0H65.856V8.07857Z" fill="currentColor"/></svg></a>
      <span class="demo-tag">Demo</span>
      <div class="spacer"></div>
      <a class="dev-link" href="/signup">Sign up →</a>
    </div>
  </header>

  <main>
    <div class="panel">
      <div class="panel-head">
        <h1>Log in to WLTH</h1>
        <p>Welcome back. Enter your credentials to continue.</p>
      </div>
      <form id="login-form" novalidate>
        <label class="field"><span class="label">Email address</span><input name="email" type="email" required placeholder="jane.doe@acmepay.com.au" autocomplete="username" /><span class="err">Enter a valid email</span></label>
        <label class="field"><span class="label">Password</span><input name="password" type="password" required placeholder="Your password" autocomplete="current-password" /><span class="err">Required</span></label>
        <div class="form-error" id="form-error"></div>
        <button type="submit" class="btn-primary" id="login-btn">Log in <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg></button>
      </form>
      <p class="alt">New to WLTH? <a href="/signup">Create an account</a></p>
    </div>
  </main>

  <script>
    (function () {
      // Already signed in? Skip straight to the landing.
      if (window.WlthSso.getAccount && window.WlthSso.getAccount()) { window.location.replace("/home"); return; }

      var form = document.getElementById("login-form");
      var btn = document.getElementById("login-btn");
      var formError = document.getElementById("form-error");

      // Prefill the credentials just created on the signup page (one-time; the
      // user still clicks Log in — no auto-login).
      try {
        var pending = JSON.parse(localStorage.getItem("wlthDemoPending") || "null");
        if (pending) {
          form.email.value = pending.email || "";
          form.password.value = pending.password || "";
          localStorage.removeItem("wlthDemoPending");
        }
      } catch (e) { /* ignore */ }

      function markField(input, invalid) { var f = input.closest(".field"); if (f) f.classList.toggle("invalid", invalid); }

      form.addEventListener("submit", async function (e) {
        e.preventDefault();
        formError.textContent = "";
        var valid = true;
        form.querySelectorAll("input").forEach(function (el) { var ok = el.checkValidity(); markField(el, !ok); if (!ok) valid = false; });
        if (!valid) return;

        btn.disabled = true; btn.textContent = "Signing in…";
        try {
          var account = await window.WlthSso.login(form.email.value.trim(), form.password.value);
          window.WlthSso.saveAccount(account);
          window.location.href = "/home";
        } catch (err) {
          formError.textContent = err.message || "Could not sign in.";
          btn.disabled = false;
          btn.innerHTML = 'Log in <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>';
        }
      });
    })();
  </script>
</body>
</html>
